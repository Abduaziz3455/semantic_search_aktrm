<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .h    { font-size: 19px; font-weight: 700; fill: #212529; }
      .t    { font-size: 15px; fill: #495057; }
      .edge { stroke: #495057; stroke-width: 2.5; fill: none; }
      .elbl { font-size: 14px; font-weight: 600; fill: #495057; }
      .num  { font-size: 16px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">How the search works</text>
  <text x="500" y="78" text-anchor="middle" class="t">No keywords, no translation, no LLM — just distance between vectors.</text>

  <!-- step 1: index the news -->
  <circle cx="56" cy="130" r="14" fill="#1c7ed6"/>
  <text x="56" y="136" text-anchor="middle" class="num">1</text>
  <text x="80" y="136" class="h" fill="#1971c2">Add the news (once)</text>

  <rect x="40" y="160" width="240" height="100" rx="14" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="160" y="196" text-anchor="middle" class="h">📰 News file</text>
  <text x="160" y="222" text-anchor="middle" class="t">16 short articles</text>
  <text x="160" y="243" text-anchor="middle" class="t">in Uzbek and Russian</text>

  <!-- step 2: search -->
  <circle cx="56" cy="400" r="14" fill="#e8590c"/>
  <text x="56" y="406" text-anchor="middle" class="num">2</text>
  <text x="80" y="406" class="h" fill="#e8590c">Search (every query)</text>

  <rect x="40" y="430" width="240" height="100" rx="14" fill="#fff4e6" stroke="#f08c00" stroke-width="1.5"/>
  <text x="160" y="466" text-anchor="middle" class="h">🔍 Your question</text>
  <text x="160" y="492" text-anchor="middle" class="t">in any language —</text>
  <text x="160" y="513" text-anchor="middle" class="t">English, Uzbek, Russian…</text>

  <!-- shared model -->
  <rect x="370" y="290" width="250" height="120" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="495" y="330" text-anchor="middle" class="h">🧠 Embedding model</text>
  <text x="495" y="356" text-anchor="middle" class="t">turns any text into a point</text>
  <text x="495" y="377" text-anchor="middle" class="t">in the same "meaning space"</text>

  <!-- vector DB -->
  <rect x="720" y="160" width="240" height="100" rx="14" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="840" y="196" text-anchor="middle" class="h">🗄️ Qdrant</text>
  <text x="840" y="222" text-anchor="middle" class="t">vector database —</text>
  <text x="840" y="243" text-anchor="middle" class="t">stores all article points</text>

  <!-- results -->
  <rect x="720" y="430" width="240" height="100" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="840" y="466" text-anchor="middle" class="h">🏆 Ranked results</text>
  <text x="840" y="492" text-anchor="middle" class="t">closest articles first,</text>
  <text x="840" y="513" text-anchor="middle" class="t">each with a score</text>

  <!-- arrows -->
  <!-- news -> model -->
  <path d="M280,225 C330,250 340,280 380,300" class="edge" marker-end="url(#arrow)"/>
  <!-- query -> model -->
  <path d="M280,470 C330,445 340,415 380,398" class="edge" marker-end="url(#arrow)"/>
  <!-- model -> qdrant (store) -->
  <path d="M620,310 C670,285 680,255 715,232" class="edge" marker-end="url(#arrow)"/>
  <text x="645" y="268" class="elbl">store</text>
  <!-- qdrant -> results (nearest) -->
  <path d="M840,260 L840,425" class="edge" marker-end="url(#arrow)"/>
  <text x="852" y="335" class="elbl">find the</text>
  <text x="852" y="354" class="elbl">nearest points</text>

  <!-- key idea -->
  <rect x="40" y="560" width="920" height="56" rx="12" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="6 4"/>
  <text x="500" y="584" text-anchor="middle" class="t" font-weight="700" fill="#212529">Same meaning → nearby points. That's why an English query finds a Russian article.</text>
  <text x="500" y="606" text-anchor="middle" class="t">Built twice — Python and Java — with the exact same model recipe, sharing this one index.</text>
</svg>
