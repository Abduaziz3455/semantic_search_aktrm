# One command brings up the whole demo:
#
#   docker compose up --build
#
# -> starts Qdrant, waits until it is healthy, auto-ingests qa.jsonl, then
#    serves the Gradio UI at http://localhost:7860
#
# All three services share one Qdrant collection ('faq'). The 'ingest' service
# populates it once and exits; 'web' waits for that to finish, then serves.
# The native Java app (see README) talks to the same Qdrant on gRPC port 6334.
services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"   # REST  (Python / Gradio)
      - "6334:6334"   # gRPC  (native Java app)
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # the qdrant image ships bash but no curl; probe the REST port over /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Recreates the 'faq' collection and indexes qa.jsonl, then exits.
  ingest:
    image: semantic-search-py
    build:
      context: .
      dockerfile: python/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - hf_cache:/hf-cache   # cache the embedding model so it downloads once
    command: ["python", "-m", "ragapp.ingest"]

  # The Gradio demo UI. Waits for ingest to finish, then serves on :7860.
  web:
    image: semantic-search-py
    build:
      context: .
      dockerfile: python/Dockerfile
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment:
      QDRANT_URL: http://qdrant:6333
      GRADIO_SERVER_NAME: 0.0.0.0   # bind all interfaces so the host can reach it
    ports:
      - "7860:7860"
    volumes:
      - hf_cache:/hf-cache
    command: ["python", "-m", "ragapp.app"]

volumes:
  qdrant_storage:
  hf_cache:
