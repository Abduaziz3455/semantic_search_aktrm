# Setup is two steps — the slow model download is separated from `up`:
#
#   docker compose build                     # build the (small) app image
#   docker compose run --rm model-download   # one-time: fetch the ~2.3 GB model
#                                            #   into a cached volume (skippable;
#                                            #   ingest will fetch it otherwise)
#   docker compose up                        # starts in seconds — no download
#
# Once the model volume is populated it persists, so `up` never waits on the
# download again. All app services share one Qdrant collection ('faq'):
# 'ingest' populates it once and exits; 'web' waits for that, then serves.
# The native Java app talks to the same Qdrant on gRPC port 6334.
services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"   # REST  (Python / Gradio)
      - "6334:6334"   # gRPC  (native Java app)
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # the qdrant image ships bash but no curl; probe the REST port over /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-time helper: download the embedding model into the shared cache volume.
  # Run it once with `docker compose run --rm model-download`. Not started by `up`.
  model-download:
    image: semantic-search-py
    build:
      context: .
      dockerfile: python/Dockerfile
    profiles: ["setup"]
    volumes:
      - model_cache:/hf-cache
    command:
      - python
      - -c
      - "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-m3'); print('model cached')"

  # Recreates the 'faq' collection and indexes qa.jsonl, then exits.
  # Uses the cached model if present; otherwise downloads it on first run.
  ingest:
    image: semantic-search-py
    build:
      context: .
      dockerfile: python/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - model_cache:/hf-cache
    command: ["python", "-m", "ragapp.ingest"]

  # The Gradio demo UI. Waits for ingest to finish, then serves on :7860.
  web:
    image: semantic-search-py
    build:
      context: .
      dockerfile: python/Dockerfile
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment:
      QDRANT_URL: http://qdrant:6333
      GRADIO_SERVER_NAME: 0.0.0.0   # bind all interfaces so the host can reach it
    ports:
      - "7860:7860"
    volumes:
      - model_cache:/hf-cache
    command: ["python", "-m", "ragapp.app"]

volumes:
  qdrant_storage:
  model_cache:
